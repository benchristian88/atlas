[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-plugin-sdk"
version = "0.1.0"
description = "Vendor-neutral plugin contracts for Atlas discovery"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
