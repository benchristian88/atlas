# Atlas managed native ingress. Updated by the verified installer/upgrade helper.
geo $atlas_native_trusted_proxy {
    default 0;
    @TRUSTED_PROXIES@
}
map "$atlas_native_trusted_proxy:$http_x_forwarded_proto" $atlas_native_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}
map $atlas_native_trusted_proxy $atlas_native_forwarded_for {
    default $remote_addr;
    1 $proxy_add_x_forwarded_for;
}
server {
    listen @BIND_ADDRESS@:@PORT@;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $atlas_native_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $atlas_native_scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Forwarded "";
    location = /api {
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/ {
        # No trailing URI: preserve /api and the query string.
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ ^/api/(system-settings/restore|setup/restore)/[0-9a-f-]+/upload$ {
        client_max_body_size 2g;
        client_body_timeout 60s;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
