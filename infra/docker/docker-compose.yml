name: atlas

services:
  gateway:
    restart: unless-stopped
    image: nginx:stable-alpine
    environment:
      ATLAS_TRUSTED_PROXIES: ${ATLAS_TRUSTED_PROXIES:-}
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/15-atlas-trusted-proxies.sh:/docker-entrypoint.d/15-atlas-trusted-proxies.sh:ro
    ports:
      - "${ATLAS_BIND_ADDRESS:-127.0.0.1}:${ATLAS_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    restart: unless-stopped
    build:
      context: ../../apps/api
      args:
        ATLAS_BUILD_ID: ${ATLAS_BUILD_ID:-unknown}
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the production bootstrap helper or set a development credential}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-auto}
      # API has no host port. Only trusted Compose services can reach it;
      # gateway sanitizes public headers before Uvicorn interprets them.
      FORWARDED_ALLOW_IPS: "*"
      ATLAS_INSTALL_METHOD: ${ATLAS_INSTALL_METHOD:-docker_compose}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  web:
    restart: unless-stopped
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC values are browser-public and compiled by Next.js. Never
        # pass database, auth, or bootstrap secrets as web build arguments.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    restart: unless-stopped
    build:
      context: ../../apps/worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the production bootstrap helper or set a development credential}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
