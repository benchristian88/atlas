# Only explicitly configured proxy peers may supply the browser's protocol.
geo $atlas_trusted_proxy {
    default 0;
    include /etc/nginx/atlas-trusted-proxies.conf;
}

map "$atlas_trusted_proxy:$http_x_forwarded_proto" $atlas_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

map $atlas_trusted_proxy $atlas_forwarded_for {
    default $remote_addr;
    1 $proxy_add_x_forwarded_for;
}

# Docker DNS keeps upstreams usable after a service container is replaced.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream atlas_api {
    zone atlas_api 256k;
    server api:8000 resolve;
}
upstream atlas_web {
    zone atlas_web 256k;
    server web:3000 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host retains a custom port for same-origin Origin validation.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $atlas_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $atlas_scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Forwarded "";

    location = /api {
        proxy_pass http://atlas_api;
    }
    location /api/ {
        # No URI/trailing slash: preserve /api and the query string unchanged.
        proxy_pass http://atlas_api;
    }
    location / {
        proxy_pass http://atlas_web;
    }
}
