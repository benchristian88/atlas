name: Atlas release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: atlas-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate metadata and deliberate release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            python infra/release/release.py metadata --tag "$RELEASE_TAG"
            git merge-base --is-ancestor HEAD origin/dev
          else
            python infra/release/release.py metadata
          fi
      - name: Install test dependencies without release credentials
        run: |
          python -m pip install -r apps/api/requirements.txt pytest==8.4.1 httpx==0.28.1
          npm ci --prefix apps/web
      - name: Release-critical regression
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/plugins/sdk:${{ github.workspace }}/plugins/proxmox
        run: bash ../../infra/ci/release-critical.sh
      - name: Frontend regression and production build
        working-directory: apps/web
        run: |
          npm test
          npm run build
      - name: Build packages and manifest using the local dry-run implementation
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            python infra/release/release.py build --dry-run --tag "$RELEASE_TAG" --output dist/release
          else
            python infra/release/release.py build --dry-run --output dist/release
          fi
          python infra/release/release.py verify --require-committed --output dist/release
          cd dist/release
          sha256sum -c SHA256SUMS
      - name: Validate and build the packaged Compose contexts without publishing
        run: |
          mkdir "$RUNNER_TEMP/atlas-package"
          tar -xzf dist/release/atlas-docker-compose-*.tar.gz -C "$RUNNER_TEMP/atlas-package"
          python infra/install/configuration.py --method docker_compose --output "$RUNNER_TEMP/atlas-package.env"
          docker compose --env-file "$RUNNER_TEMP/atlas-package.env" -f "$RUNNER_TEMP"/atlas-package/atlas-docker-compose-*/infra/docker/docker-compose.yml config --quiet
          docker compose --env-file "$RUNNER_TEMP/atlas-package.env" -f "$RUNNER_TEMP"/atlas-package/atlas-docker-compose-*/infra/docker/docker-compose.yml build api web worker
          rm "$RUNNER_TEMP/atlas-package.env"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'benchristian88/atlas'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atlas-release-assets
          path: dist/release
      - name: Reverify validated artifacts before publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 infra/release/release.py verify --require-committed --tag "$RELEASE_TAG" --output dist/release
      - name: Publish exactly the validated release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 infra/release/publish.py --tag "$RELEASE_TAG" --output dist/release
