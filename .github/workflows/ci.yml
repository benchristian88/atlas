name: Atlas CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  backend:
    name: Backend / PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/plugins/sdk:${{ github.workspace }}/plugins/proxmox
      ATLAS_TEST_H3_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      redis:
        image: redis:7.4.6-alpine
        ports: ['127.0.0.1:6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.txt
            plugins/*/pyproject.toml
      - name: Install regression dependencies
        run: |
          python -m pip install --no-index --no-deps --require-hashes --find-links vendor/sdk -r vendor/sdk/requirements.txt
          python -m pip install -r apps/api/requirements.txt pytest==8.4.1 httpx==0.28.1 psutil==7.2.2
          PYTHONPATH=apps/api python -m scripts.prepare_attestation_verifier
      - name: Install PostgreSQL 17 clients and test nginx
        run: bash infra/ci/install-linux-dependencies.sh
      - name: Install isolated pinned Ansible runtime for discovery acceptance
        # -I excludes the backend job's legacy plugin PYTHONPATH/egg-info and
        # user site packages; --clear prevents reuse of an old runtime environment.
        run: |
          python -I -m venv --clear "$RUNNER_TEMP/atlas-ci-runtime"
          "$RUNNER_TEMP/atlas-ci-runtime/bin/python" -I -m pip install --no-index --no-deps --require-hashes --find-links vendor/sdk -r vendor/sdk/requirements.txt
          "$RUNNER_TEMP/atlas-ci-runtime/bin/python" -I -m pip install --no-deps -r apps/runtime/ansible/requirements.lock
          "$RUNNER_TEMP/atlas-ci-runtime/bin/python" -I -m pip check
          echo "ATLAS_TEST_RUNTIME_PYTHON=$RUNNER_TEMP/atlas-ci-runtime/bin/python" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://127.0.0.1:6379/0" >> "$GITHUB_ENV"
      - name: Start isolated PostgreSQL with generated credentials and prepare all test databases
        # Starting after configuration generation avoids static service passwords
        # or trust authentication. Redis uses the standard Actions service above.
        env:
          ATLAS_BIND_ADDRESS: 127.0.0.1
        run: |
          python infra/install/configuration.py --method docker_compose --output "$RUNNER_TEMP/atlas-ci-postgres.env"
          docker run --detach --name atlas-ci-postgres \
            --env-file "$RUNNER_TEMP/atlas-ci-postgres.env" \
            --env POSTGRES_USER=atlas_ci_bootstrap --env POSTGRES_DB=postgres \
            --publish 127.0.0.1:5432:5432 \
            --health-cmd 'pg_isready -U atlas_ci_bootstrap -d postgres' \
            --health-interval 5s --health-timeout 5s --health-retries 12 \
            postgres:17-alpine
          python infra/ci/prepare-postgres.py --config "$RUNNER_TEMP/atlas-ci-postgres.env" --github-env "$GITHUB_ENV"
          python -c 'import os; from redis import Redis; assert Redis.from_url(os.environ["ATLAS_TEST_H3_REDIS_URL"]).ping()'
      - name: Require exactly one Alembic head
        working-directory: apps/api
        run: |
          python -m alembic heads
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
          assert len(heads) == 1, f'Expected one Alembic head, found {heads}'
          PY
      - name: Ordinary-user API, SDK, Proxmox, PostgreSQL and migration regression (no skips)
        working-directory: apps/api
        run: |
          python -m pytest tests ../../plugins/sdk/tests ../../plugins/proxmox/tests \
            --ignore=tests/test_local_release_authority_postgres.py \
            --ignore=tests/test_local_release_recovery.py \
            --ignore=tests/test_local_release_remediation.py \
            -q -rs --tb=short --junitxml="$RUNNER_TEMP/atlas-ci-backend.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          report = ElementTree.parse(Path(os.environ['RUNNER_TEMP']) / 'atlas-ci-backend.xml')
          skipped = report.findall('.//testcase/skipped')
          assert not skipped, f'{len(skipped)} tests skipped; all PostgreSQL/nginx suites must run'
          PY
      - name: Root-only local-release security regression in disposable Docker (no skips)
        # Part of the existing Backend check: neither regression can fail or skip
        # independently while that required check reports success.
        env:
          ATLAS_BIND_ADDRESS: 127.0.0.1
        run: |
          python infra/install/configuration.py --method docker_compose --output "$RUNNER_TEMP/atlas-ci-local-release.env"
          docker build --file apps/api/Dockerfile -t atlas-ci-local-release-api .
          docker compose --project-name atlas-ci-local-release --env-file "$RUNNER_TEMP/atlas-ci-local-release.env" \
            -f infra/ci/docker-compose.local-release-tests.yml build tests
          docker compose --project-name atlas-ci-local-release --env-file "$RUNNER_TEMP/atlas-ci-local-release.env" \
            -f infra/ci/docker-compose.local-release-tests.yml run --rm tests
      - name: I0 AIP and Manifest contract regression
        # Run separately: legacy SDK tests also use the test_contracts basename.
        run: python -m pytest docs/architecture/integrations/contracts/tests -q --tb=short
      - name: Compile Python source, migrations, tests and tooling
        run: python -m compileall -q apps/api/app apps/api/scripts apps/api/migrations apps/api/tests apps/worker/worker apps/runtime infra/install infra/release infra/ci plugins
      - name: Remove disposable PostgreSQL and protected configuration
        if: always()
        run: |
          trap 'rm -f "$RUNNER_TEMP/atlas-ci-postgres.env" "$RUNNER_TEMP/atlas-ci-local-release.env"' EXIT
          cleanup_status=0
          if [ -f "$RUNNER_TEMP/atlas-ci-local-release.env" ]; then
            docker compose --project-name atlas-ci-local-release --env-file "$RUNNER_TEMP/atlas-ci-local-release.env" \
              -f infra/ci/docker-compose.local-release-tests.yml down --volumes --remove-orphans || cleanup_status=$?
          fi
          if docker container inspect atlas-ci-postgres > /dev/null 2>&1; then
            docker rm --force --volumes atlas-ci-postgres || cleanup_status=$?
          fi
          exit "$cleanup_status"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Frontend regression
        run: npm test
      - name: Production frontend build
        run: npm run build
      # npm audit is deliberately omitted as a merge gate: inherited findings
      # remain tracked in docs/testing/continuous-integration.md and H4 evidence.

  release-and-deployment-integrity:
    name: Release & Deployment Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.txt
            plugins/*/pyproject.toml
      - name: Install release regression dependencies
        run: |
          python -m pip install --no-index --no-deps --require-hashes --find-links vendor/sdk -r vendor/sdk/requirements.txt
          python -m pip install -r apps/api/requirements.txt pytest==8.4.1 httpx==0.28.1 psutil==7.2.2
          PYTHONPATH=apps/api python -m scripts.prepare_attestation_verifier
      - name: Validate canonical release metadata
        run: python infra/release/release.py metadata
      - name: Shared release-critical regression
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/plugins/sdk:${{ github.workspace }}/plugins/proxmox
        run: bash ../../infra/ci/release-critical.sh
      - name: I0 AIP and Manifest contract regression
        run: python -m pytest docs/architecture/integrations/contracts/tests -q --tb=short
      - name: Workflow lint and repository whitespace
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/ci.yml .github/workflows/release.yml
          git diff-tree --check --root -m HEAD
          git diff --check
      - name: Construct and verify committed dry-run packages
        run: |
          python infra/release/release.py build --dry-run --output dist/release
          python infra/release/release.py verify --require-committed --output dist/release
      - name: Verify SHA256SUMS independently
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS
      - name: Extract Docker and native packages and check installer help
        run: |
          mkdir "$RUNNER_TEMP/atlas-ci-packages"
          for archive in dist/release/atlas-*.tar.gz; do
            tar -xzf "$archive" -C "$RUNNER_TEMP/atlas-ci-packages"
          done
          for package in "$RUNNER_TEMP"/atlas-ci-packages/atlas-*; do
            python "$package/infra/install/configuration.py" --help
            python "$package/infra/install/upgrade.py" --help
          done
          python "$RUNNER_TEMP"/atlas-ci-packages/atlas-docker-compose-*/infra/install/compose.py --help
          python "$RUNNER_TEMP"/atlas-ci-packages/atlas-systemd-*/infra/install/native.py --help
      - name: Validate protected configuration and production/development Compose; build packaged images
        env:
          ATLAS_BIND_ADDRESS: 127.0.0.1
        run: |
          python infra/install/configuration.py --method docker_compose --output "$RUNNER_TEMP/atlas-ci-package.env"
          PYTHONPATH=infra/install python - <<'PY'
          import os
          from pathlib import Path
          from upgrade import protected_configuration
          protected_configuration(Path(os.environ['RUNNER_TEMP']) / 'atlas-ci-package.env', 'docker_compose')
          PY
          docker compose --env-file "$RUNNER_TEMP/atlas-ci-package.env" -f infra/docker/docker-compose.yml config --quiet
          docker compose --env-file "$RUNNER_TEMP/atlas-ci-package.env" -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.dev.yml config --quiet
          docker compose --env-file "$RUNNER_TEMP/atlas-ci-package.env" -f "$RUNNER_TEMP"/atlas-ci-packages/atlas-docker-compose-*/infra/docker/docker-compose.yml config --quiet
          docker compose --env-file "$RUNNER_TEMP/atlas-ci-package.env" -f "$RUNNER_TEMP"/atlas-ci-packages/atlas-docker-compose-*/infra/docker/docker-compose.yml build api web worker runtime runtime-init connector-bootstrap
      - name: Remove protected package configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/atlas-ci-package.env"
